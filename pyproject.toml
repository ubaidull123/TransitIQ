[project]
name = "transitiq"
version = "0.2.0"
description = "Shipment exception management powered by LangGraph agents"
readme = "README.md"
authors = [
    { name = "Ubaidullah Saeed", email = "ubaidullahsaeed2006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.116.0",
    "langchain>=1.3.18",
    "langchain-openrouter>=0.2.8",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.5",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
transitiq = "transitiq.main:main"
transitiq-api = "transitiq.api.run:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "transitiq"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::RuntimeWarning:unittest.mock",
]
markers = [
    "live: marks tests as requiring live OpenRouter LLM API calls (deselect with '-m \"not live\"')",
]
