[project]
name = "transitiq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ubaidullah Saeed", email = "ubaidullahsaeed2006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite3>=0.3.0",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "langchain>=1.3.18",
    "langchain-openrouter>=0.2.8",
    "langgraph>=1.2.11",
    "psycopg2>=2.9.12",
    "pydantic>=2.13.5",
    "uvicorn>=0.52.4",
]

[project.scripts]
transitiq = "transitiq_v2.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
